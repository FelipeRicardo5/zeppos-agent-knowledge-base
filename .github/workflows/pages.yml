# Publish the landing page.
#
# `site/` is generated by `npm run render` and committed, and CI fails if it
# does not match what the renderer produces from `data/` — so this job does not
# build anything. It stages the committed page, copies `assets/` in beside it
# (the tree keeps one copy of the logo, and the page references `assets/`), and
# uploads the result.
#
# Requires Pages to be enabled for the repo with "GitHub Actions" as the source:
# Settings -> Pages -> Build and deployment -> Source.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read the tree, write a Pages deployment, mint the token the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a push that lands mid-deploy waits rather than
# cancelling: a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the page with its assets
        run: |
          mkdir -p site/assets
          cp assets/*.png site/assets/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
